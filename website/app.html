<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get the Foodyzz App</title>
  <meta name="description" content="Download Foodyzz — e-bike rentals delivered to your door in New York City. Available on iPhone and Android." />
  <meta name="theme-color" content="#86B54F" />
  <!-- This page only forwards to a store. Nothing here to index, and it must never
       outrank the real pages for "foodyzz app". -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://foodyzz.com/app" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/foodyzz-icon.png" />
  <meta name="apple-itunes-app" content="app-id=6794564474" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Redirect before first paint, so a phone that scanned the QR never sees this
       page at all. Desktop and anything unrecognised falls through to the markup
       below, which lists both stores. -->
  <script>
    (function () {
      var IOS = 'https://apps.apple.com/us/app/foodyzz/id6794564474';
      var ANDROID = 'https://play.google.com/store/apps/details?id=com.foodyzz';
      var ua = navigator.userAgent || '';

      // Bail out for in-app browsers that break on a cross-scheme jump, and for
      // anything claiming to be a crawler — they should see the real markup.
      if (/bot|crawl|spider|slurp|preview|facebookexternalhit|WhatsApp|Twitterbot/i.test(ua)) return;

      var isAndroid = /Android/i.test(ua) && !/Windows Phone/i.test(ua);
      // iPadOS 13+ reports a Mac UA, so a touch count is the only way to tell an
      // iPad from a desktop Mac. A real Mac must NOT be sent to the iOS store.
      var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
                  (/Macintosh/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 1);

      var target = isAndroid ? ANDROID : (isIOS ? IOS : null);
      if (target) window.location.replace(target);
    })();
  </script>

  <style>
    :root {
      --green: #86B54F; --green-dark: #507425; --green-tint: #EFF5E6;
      --black: #0A0A0A; --paper: #FAFAF7; --stone-mid: #A8A29E; --stone-text: #57534E;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--paper); color: var(--black); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .wrap { width: 100%; max-width: 460px; text-align: center; }
    .logo { width: 190px; max-width: 60%; height: auto; margin: 0 auto 26px; display: block; }
    h1 {
      font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.02em;
      font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.12;
    }
    .sub { color: var(--stone-text); margin-top: 12px; font-size: .95rem; }
    .badges { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    .badge {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 20px; border: 2px solid var(--black); border-radius: var(--radius);
      background: var(--white, #fff); color: var(--black); text-decoration: none;
      box-shadow: 4px 4px 0 0 var(--black);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .badge:hover, .badge:focus-visible { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 var(--black); }
    .badge .small {
      display: block; font-size: .65rem; font-weight: 400; color: var(--stone-text);
      text-transform: uppercase; letter-spacing: .06em; line-height: 1.3;
    }
    .badge .big { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 700; line-height: 1.1; }
    .badge .txt { text-align: left; }
    .qr-card {
      margin-top: 28px; padding: 18px; border: 2px solid var(--black); border-radius: var(--radius);
      background: var(--green-tint);
    }
    .qr-card img { width: 148px; height: 148px; display: block; margin: 0 auto; border-radius: 6px; }
    .qr-card p {
      font-family: 'JetBrains Mono', monospace; font-size: .62rem; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase; color: var(--green-dark); margin-top: 12px;
    }
    .back { display: inline-block; margin-top: 26px; font-size: .85rem; color: var(--green-dark); font-weight: 600; }
    /* A phone is being redirected by the script above; showing it a QR to scan
       with the device already in its hand is nonsense. */
    @media (hover: none) and (pointer: coarse) { .qr-card { display: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="assets/foodyzz-wordmark.png" alt="Foodyzz" />
    <h1>Get the Foodyzz app</h1>
    <p class="sub">Rent, rent to buy, or buy a delivery e-bike — and we bring it to your door in New York City.</p>

    <div class="badges">
      <a class="badge" href="https://apps.apple.com/us/app/foodyzz/id6794564474" rel="noopener"
         aria-label="Download Foodyzz on the App Store">
        <svg width="20" height="24" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50.1-84.9-18.8-26.9-47.2-41.7-84.7-44.6-36.8-2.8-77 21.3-91.7 21.3-15.5 0-51.1-20.3-79.1-20.3C56.9 141.2 0 184.4 0 272.2c0 26.1 4.8 53.1 14.4 80.8 12.8 36.5 62 122.3 113.4 120.7 26.9-.6 45.8-19.1 80.8-19.1 33.8 0 50.9 18.5 80.7 18.5 51.8-.8 96.2-78.8 108.3-115.4-69.4-32.7-78.9-96.4-78.9-89zM256.6 68.3c25.8-30.6 22.7-58.4 21.7-68.3-21.8 1.3-47 14.9-61.3 31.7-15.8 18-25.1 40.3-23.1 65.1 23.6 1.8 45.2-10.3 62.7-28.5z" />
        </svg>
        <span class="txt"><span class="small">Download on the</span><span class="big">App Store</span></span>
      </a>
      <a class="badge" href="https://play.google.com/store/apps/details?id=com.foodyzz" rel="noopener"
         aria-label="Get Foodyzz on Google Play">
        <span style="font-size:1.5rem" aria-hidden="true">▶</span>
        <span class="txt"><span class="small">Get it on</span><span class="big">Google Play</span></span>
      </a>
    </div>

    <div class="qr-card">
      <img src="assets/foodyzz-app-qr.png" alt="QR code linking to the Foodyzz app download page" />
      <p>Scan with your phone</p>
    </div>

    <a class="back" href="/">&larr; Back to foodyzz.com</a>
  </main>
</body>
</html>
