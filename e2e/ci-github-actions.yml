# CI for the QA harness. Copy this to `.github/workflows/test.yml` to enable it.
# (It isn't committed under .github/workflows directly because that path requires
# a token with the GitHub `workflow` scope; copying it locally and pushing with
# such a token — or adding it via the GitHub web UI — activates it.)
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend + rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions deps
        run: npm install --prefix functions
      - name: Backend transaction + payment tests
        run: npm --prefix functions test
        env:
          # Optional: set this repo secret to also run the live Stripe test-mode
          # flow. Unset → the Stripe block is skipped (not failed).
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}

      - name: Install rules-test deps
        run: npm install --prefix firestore-tests
      - name: Firestore rules tests
        run: npm --prefix firestore-tests test
