<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — UniHamper</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#14224A">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF3FB;--ink:#14224A;--ink-soft:#48577E;
    --blue:#3B4FE0;--blue-deep:#2537B8;--sun:#FFC93C;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Instrument Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--body);display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;position:relative;overflow:hidden;
  }
  .sun{position:absolute;width:280px;height:280px;border-radius:50%;background:var(--sun);top:-110px;right:-90px;opacity:.55}
  .blue{position:absolute;width:160px;height:160px;border-radius:50%;background:var(--blue);bottom:-60px;left:-50px;opacity:.35}
  .wrap{position:relative;z-index:2;max-width:34rem}
  .code{font-family:var(--display);font-weight:800;font-size:clamp(5rem,18vw,9rem);line-height:1;letter-spacing:-.03em;color:var(--blue)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em;margin:8px 0 12px}
  p{color:var(--ink-soft);font-size:1.05rem;line-height:1.6;margin-bottom:28px}
  .btn{
    display:inline-block;background:var(--blue);color:#fff;font-weight:600;
    padding:14px 26px;border-radius:14px;text-decoration:none;
    box-shadow:0 10px 22px -10px rgba(59,79,224,.7);transition:transform .15s ease,background .15s ease;
  }
  .btn:hover{background:var(--blue-deep);transform:translateY(-2px)}
  .links{margin-top:22px;font-size:.95rem}
  .links a{color:var(--ink-soft);text-decoration:none;margin:0 10px}
  .links a:hover{color:var(--ink);text-decoration:underline}
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="blue"></div>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page went missing.</h1>
    <p>Looks like this one got lost in the wash. Let's get you back to a clean start.</p>
    <a class="btn" href="/">Back to home</a>
    <div class="links">
      <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a>
    </div>
  </div>
</body>
</html>
